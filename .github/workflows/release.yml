# pub.dev + GitHub Release on push of tag v* (e.g. v2.0.0).
# pubspec.yaml version: must match the tag without the v prefix.

name: Release (pub.dev + GitHub)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify pubspec version matches tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VER=$(grep '^version:' pubspec.yaml | head -1 | awk '{print $2}')
          echo "Git tag (no v): $TAG"
          echo "pubspec version:   $VER"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::pubspec version ($VER) does not match tag (v$TAG). Update pubspec or retag."
            exit 1
          fi
          echo "RELEASE_VERSION=$TAG" >> "$GITHUB_ENV"

      - name: Setup Java (Android plugin verification)
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter (pin from .github/flutter-version)
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .github/flutter-version
          channel: stable
          cache: true

      - name: Disable analytics (CI)
        run: flutter config --no-analytics

      - name: Validate package
        run: |
          chmod +x scripts/validate-package.sh
          ./scripts/validate-package.sh

      - name: Build clean source archive (git archive)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          git archive --format=zip --output LevelPlay-SDK-Flutter-release.zip HEAD
          unzip -l LevelPlay-SDK-Flutter-release.zip | grep -E '(^|/)(\.git|build/|\.dart_tool/|\.gradle/|local\.properties|Pods/|\.symlinks/|__MACOSX|\.DS_Store|/\._)' && exit 1 || true

      - name: GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: bidscube_levelplay_flutter ${{ env.RELEASE_VERSION }}
          generate_release_notes: true
          files: LevelPlay-SDK-Flutter-release.zip
          body: |
            ## Install (pub.dev)

            ```yaml
            dependencies:
              unity_levelplay_mediation: ^9.2.0
              bidscube_levelplay_flutter: ^${{ env.RELEASE_VERSION }}
            ```

            Load/show via `unity_levelplay_mediation`. See README.

      - name: Publish to pub.dev
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set +e
          output=$(dart pub publish -f 2>&1)
          rc=$?
          echo "$output"
          if [ "$rc" -ne 0 ]; then
            if echo "$output" | grep -qi "already exists"; then
              echo "Version already on pub.dev — workflow finished."
              exit 0
            fi
            exit "$rc"
          fi
