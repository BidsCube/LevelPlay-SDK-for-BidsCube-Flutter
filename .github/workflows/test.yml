name: Test and Validate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter (pin from .github/flutter-version)
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .github/flutter-version
          channel: stable
          cache: true

      - name: Disable analytics (CI)
        run: flutter config --no-analytics

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Validate package
        run: |
          chmod +x scripts/validate-package.sh
          ./scripts/validate-package.sh
