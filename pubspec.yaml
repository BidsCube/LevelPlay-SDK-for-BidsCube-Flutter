name: bidscube_levelplay_flutter
description: Lightweight LevelPlay wiring for Bidscube — native Android/iOS adapter dependencies and optional pre-init bridge. Load/show via unity_levelplay_mediation.
version: 2.0.0
homepage: https://github.com/BidsCube/LevelPlay-SDK-Flutter

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.bidscube.levelplay.flutter
        pluginClass: BidscubeLevelPlayFlutterPlugin
      ios:
        pluginClass: BidscubeLevelPlayFlutterPlugin
